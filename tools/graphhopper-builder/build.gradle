plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.graphhopper:graphhopper-core:9.1'
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.example.offnav.tools.GraphBuilder'
    applicationDefaultJvmArgs = ['-Xms1g', '-Xmx12g', '-Dfile.encoding=UTF-8']
}

tasks.register('extractSearchData', JavaExec) {
    group = 'application'
    description = 'Extracts Austin addresses and POIs from an OSM PBF into TSV.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.offnav.tools.AustinSearchExtractor'
    jvmArgs '-Xms512m', '-Xmx8g', '-Dfile.encoding=UTF-8'
}
